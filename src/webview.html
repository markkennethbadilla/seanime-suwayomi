<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html { color-scheme: dark; }
  body { background: transparent; margin: 0; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; color: #e5e7eb; font-size: 14px; }
  .wrap { padding: 24px 28px 48px; max-width: 1400px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; font-weight: 700; }
  .sub { color: #9ca3af; margin-bottom: 20px; }
  .panel { background: #121212; border: 1px solid #262626; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select { background: #0b0b0b; color: #e5e7eb; border: 1px solid #2e2e2e; border-radius: 8px; padding: 8px 10px; font: inherit; outline: none; }
  input:focus, select:focus { border-color: #6366f1; }
  input[type=search], input.url { flex: 1; min-width: 220px; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 7px 12px; cursor: pointer; background: #262626; color: #e5e7eb; }
  button:hover { filter: brightness(1.2); }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: #4f46e5; color: #fff; }
  .warn { background: #b45309; color: #fff; }
  .help { background: #2a1d0a; border: 1px solid #b45309; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; line-height: 1.6; }
  .help div:first-child { font-weight: 600; }
  .help code, .help .cmd { font-family: ui-monospace, Consolas, monospace; background: #0b0b0b; padding: 1px 6px; border-radius: 6px; user-select: all; }
  .ghost { background: transparent; border: 1px solid #2e2e2e; color: #9ca3af; }
  .chip { display: inline-flex; gap: 6px; align-items: center; background: #1c1c1c; border: 1px solid #2e2e2e; border-radius: 999px; padding: 4px 6px 4px 12px; }
  .chip button { padding: 2px 8px; border-radius: 999px; background: transparent; color: #f87171; }
  .label { color: #9ca3af; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-right: 4px; }
  .seg { display: inline-flex; border: 1px solid #2e2e2e; border-radius: 8px; overflow: hidden; }
  .seg button { border-radius: 0; background: transparent; color: #9ca3af; padding: 7px 10px; }
  .seg button.on { background: #262626; color: #fff; }
  .count { color: #9ca3af; margin: 4px 2px 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { display: flex; gap: 12px; background: #121212; border: 1px solid #262626; border-radius: 12px; padding: 12px; align-items: flex-start; }
  .card.installed { border-color: #312e81; }
  .icon { width: 48px; height: 48px; border-radius: 10px; background: #1f1f1f; flex: none; object-fit: cover; }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pkg { color: #6b7280; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0 6px; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: #1f1f1f; color: #d1d5db; border: 1px solid #2a2a2a; }
  .tag.lang { background: #1e293b; border-color: #334155; color: #93c5fd; }
  .tag.nsfw { background: #450a0a; border-color: #7f1d1d; color: #fca5a5; }
  .tag.mixed { background: #431407; border-color: #7c2d12; color: #fdba74; }
  .tag.ok { background: #052e16; border-color: #14532d; color: #86efac; }
  .tag.upd { background: #422006; border-color: #713f12; color: #fde047; }
  .tag.obs { background: #27272a; color: #a1a1aa; text-decoration: line-through; }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .empty { color: #9ca3af; text-align: center; padding: 48px 0; }
  .more { display: block; margin: 16px auto 0; }
  .more[hidden] { display: none; }
  .status { font-size: 13px; color: #9ca3af; }
  .status b { color: #86efac; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mihon Extensions</h1>
  <div class="sub">Install Tachiyomi/Mihon sources through Suwayomi. <span class="status" id="status"></span></div>
  <div class="help" id="help" hidden></div>

  <div class="panel">
    <div class="row" style="margin-bottom:10px"><span class="label">Repositories</span><span id="stores" class="row"></span></div>
    <form class="row" id="addForm">
      <input class="url" id="repoUrl" placeholder="https://github.com/…/raw/repo/index.pb">
      <button class="primary" id="addBtn" type="submit">Add repo</button>
      <button class="ghost" type="button" id="refreshBtn">Refresh list</button>
    </form>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:10px">
      <input type="search" id="q" placeholder="Search by name or package…">
      <select id="lang"></select>
      <select id="store"></select>
    </div>
    <div class="row">
      <span class="label">Status</span>
      <span class="seg" id="segStatus">
        <button data-v="all" class="on">All</button><button data-v="installed">Installed</button><button data-v="updates">Updates</button><button data-v="available">Not installed</button>
      </span>
      <span class="label" style="margin-left:12px">Content</span>
      <span class="seg" id="segContent">
        <button data-v="sfw" class="on">SFW</button><button data-v="all">All</button><button data-v="nsfw">NSFW only</button>
      </span>
      <span class="label" style="margin-left:12px">Sort</span>
      <span class="seg" id="segSort">
        <button data-v="name" class="on">Name</button><button data-v="lang">Language</button>
      </span>
    </div>
  </div>

  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <button class="ghost more" id="more" hidden>Load more</button>
</div>

<script>
  const PAGE = 60;
  let exts = [], stores = [], busy = [], status = "", help = [], shown = PAGE;
  const f = { q: "", lang: "", store: "", status: "all", content: "sfw", sort: "name" };
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let dn = null;
  try { dn = new Intl.DisplayNames(["en"], { type: "language" }); } catch (e) {}
  function langName(code) {
    if (code === "all") return "Multi";
    if (code === "other") return "Other";
    try { return (dn && dn.of(code.replace("_", "-"))) || code; } catch (e) { return code; }
  }

  function render() {
    $("status").innerHTML = status ? "· " + (status.startsWith("Running") ? "<b>" + esc(status) + "</b>" : esc(status)) : "";

    // Setup instructions from the plugin (e.g. Java missing), with copyable commands and a retry button.
    $("help").hidden = !help.length;
    $("help").innerHTML = help.map(l => {
      const m = l.match(/^(• [^:]+: )(.*)$/);
      return "<div>" + (m ? esc(m[1]) + `<span class="cmd">${esc(m[2])}</span>` : esc(l)) + "</div>";
    }).join("") + (help.length ? `<div style="margin-top:10px"><button class="primary" id="retryBtn">Start / Retry</button></div>` : "");

    $("stores").innerHTML = stores.length
      ? stores.map(s => `<span class="chip">${esc(s.name)}<button title="Remove" data-rm="${esc(s.indexUrl)}">✕</button></span>`).join("")
      : `<span class="status">No repositories yet</span>`;

    // language + store dropdowns, keep the current selection
    const langs = [...new Set(exts.map(e => e.lang))].sort((a, b) => langName(a).localeCompare(langName(b)));
    $("lang").innerHTML = `<option value="">All languages</option>` +
      langs.map(l => `<option value="${esc(l)}" ${l === f.lang ? "selected" : ""}>${esc(langName(l))} (${esc(l)})</option>`).join("");
    const storeNames = [...new Set(exts.map(e => e.store).filter(Boolean))].sort();
    $("store").innerHTML = `<option value="">All repos</option>` +
      storeNames.map(s => `<option ${s === f.store ? "selected" : ""}>${esc(s)}</option>`).join("");

    const q = f.q.trim().toLowerCase();
    let list = exts.filter(e =>
      (!q || e.name.toLowerCase().includes(q) || e.pkgName.toLowerCase().includes(q)) &&
      (!f.lang || e.lang === f.lang) &&
      (!f.store || e.store === f.store) &&
      (f.status === "all" || (f.status === "installed" && e.isInstalled) || (f.status === "updates" && e.hasUpdate) || (f.status === "available" && !e.isInstalled)) &&
      (f.content === "all" || (f.content === "sfw" && e.contentWarning === "SAFE") || (f.content === "nsfw" && e.contentWarning !== "SAFE")));
    list.sort((a, b) => (Number(b.isInstalled) - Number(a.isInstalled)) ||
      (f.sort === "lang" ? langName(a.lang).localeCompare(langName(b.lang)) : 0) || a.name.localeCompare(b.name));

    $("count").textContent = `${list.length} of ${exts.length} extensions`;
    $("grid").innerHTML = list.length ? list.slice(0, shown).map(card).join("")
      : `<div class="empty" style="grid-column:1/-1">${exts.length ? "No extensions match these filters." : "Add a repository to see extensions."}</div>`;
    $("more").hidden = list.length <= shown;
    $("addBtn").disabled = busy.includes("__repo__");
  }

  function card(e) {
    const b = busy.includes(e.pkgName);
    const cw = e.contentWarning === "NSFW" ? `<span class="tag nsfw">18+</span>` : e.contentWarning === "MIXED" ? `<span class="tag mixed">Mixed</span>` : "";
    let actions;
    if (b) actions = `<button disabled>Working…</button>`;
    else if (!e.isInstalled) actions = `<button class="primary" data-act="install" data-pkg="${esc(e.pkgName)}">Install</button>`;
    else actions = (e.hasUpdate ? `<button class="warn" data-act="update" data-pkg="${esc(e.pkgName)}">Update</button>` : "") +
      `<button class="ghost" data-act="uninstall" data-pkg="${esc(e.pkgName)}">Remove</button>`;
    return `<div class="card ${e.isInstalled ? "installed" : ""}">
      <img class="icon" loading="lazy" src="${esc(e.iconUrl)}" onerror="this.style.visibility='hidden'">
      <div class="body">
        <div class="name" title="${esc(e.name)}">${esc(e.name)}</div>
        <div class="pkg" title="${esc(e.pkgName)}">${esc(e.pkgName)}</div>
        <div class="tags">
          <span class="tag lang">${esc(langName(e.lang))}</span>
          <span class="tag">v${esc(e.versionName)}</span>
          ${cw}
          ${e.isInstalled ? `<span class="tag ok">Installed</span>` : ""}
          ${e.hasUpdate ? `<span class="tag upd">Update</span>` : ""}
          ${e.isObsolete ? `<span class="tag obs">Obsolete</span>` : ""}
          ${e.store ? `<span class="tag">${esc(e.store)}</span>` : ""}
        </div>
      </div>
      <div class="actions">${actions}</div>
    </div>`;
  }

  // ---- events
  const send = (ev, payload) => window.webview.send(ev, payload);
  $("q").addEventListener("input", e => { f.q = e.target.value; shown = PAGE; render(); });
  $("lang").addEventListener("change", e => { f.lang = e.target.value; shown = PAGE; render(); });
  $("store").addEventListener("change", e => { f.store = e.target.value; shown = PAGE; render(); });
  for (const [id, key] of [["segStatus", "status"], ["segContent", "content"], ["segSort", "sort"]]) {
    $(id).addEventListener("click", e => {
      const v = e.target.dataset && e.target.dataset.v; if (!v) return;
      f[key] = v; shown = PAGE;
      [...$(id).children].forEach(c => c.classList.toggle("on", c.dataset.v === v));
      render();
    });
  }
  $("more").addEventListener("click", () => { shown += PAGE; render(); });
  $("grid").addEventListener("click", e => {
    const t = e.target.closest("button[data-act]"); if (!t) return;
    send("ext-action", { pkg: t.dataset.pkg, action: t.dataset.act });
  });
  $("stores").addEventListener("click", e => {
    const t = e.target.closest("button[data-rm]"); if (!t) return;
    send("remove-repo", t.dataset.rm); // confirm() is blocked in the sandboxed iframe
  });
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const url = $("repoUrl").value.trim(); if (!url) return;
    send("add-repo", url); $("repoUrl").value = "";
  });
  $("refreshBtn").addEventListener("click", () => send("refresh", true));

  // ---- state from the plugin
  window.webview.on("exts", v => { exts = v || []; render(); });
  window.webview.on("stores", v => { stores = v || []; render(); });
  window.webview.on("busy", v => { busy = v || []; render(); });
  window.webview.on("status", v => { status = v || ""; render(); });
  window.webview.on("help", v => { help = v || []; render(); });
  $("help").addEventListener("click", e => { if (e.target.id === "retryBtn") send("start", true); });
  render();
  send("ready", true);
</script>
</body>
</html>
