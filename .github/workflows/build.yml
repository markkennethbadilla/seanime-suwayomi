name: build

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: dist/ is up to date and valid
        run: node scripts/check.js
      - name: Plugin works on every platform (simulated)
        run: node scripts/test.js
